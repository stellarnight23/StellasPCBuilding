<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Ash's PC Building</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth-nav.js" defer></script>
</head>
<body class="auth-page">
    <header>
        <div class="flex-container"><img src="images/Banner.png" alt="Ash's PC Building Banner" id="banner"></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="policy.html">Terms of Service</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="auth.html">Account</a></li>
            </ul>
        </nav>
        <div class="flex-container"><img src="images/Logo.png" alt="Ash's PC Building Logo" id="logo"></div>
    </header>

    <main class="auth-main">
        <section class="auth-intro">
            <p class="chat-eyebrow">Ash's PC Building</p>
            <h1>Set a new password</h1>
            <p>Choose a new password for your account.</p>
        </section>
        <section class="auth-card">
            <div class="auth-form-wrap">
                <div class="auth-form-panel active">
                    <h2>Reset password</h2>
                    <p class="auth-supporting-text">Use at least 8 characters.</p>
                    <form id="resetForm" novalidate>
                        <label for="newPassword">New password</label>
                        <div class="password-field">
                            <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
                            <button class="password-toggle" type="button" data-target="newPassword" aria-label="Show password">Show</button>
                        </div>
                        <label for="confirmPassword">Confirm password</label>
                        <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
                        <button class="auth-submit" type="submit">Update password</button>
                        <p class="form-message" id="resetMessage" role="status"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer><p>&copy; 2026 Ash's PC Building</p></footer>
    <script>
        document.querySelector('.password-toggle').addEventListener('click', (event) => {
            const input = document.getElementById(event.currentTarget.dataset.target);
            const visible = input.type === 'password';
            input.type = visible ? 'text' : 'password';
            event.currentTarget.textContent = visible ? 'Hide' : 'Show';
        });

        document.getElementById('resetForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.getElementById('resetMessage');
            const password = document.getElementById('newPassword').value;
            const confirmation = document.getElementById('confirmPassword').value;
            if (password.length < 8 || password !== confirmation) {
                message.textContent = password !== confirmation ? 'The passwords do not match.' : 'Use at least 8 characters.';
                message.classList.add('error');
                return;
            }

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: new URLSearchParams(window.location.search).get('token'), password })
                });
                const result = await response.json();
                message.textContent = response.ok ? 'Password updated. You can now log in.' : result.error;
                message.classList.toggle('error', !response.ok);
                if (response.ok) setTimeout(() => { window.location.href = 'auth.html'; }, 1200);
            } catch {
                message.textContent = 'The account server is unavailable. Please try again.';
                message.classList.add('error');
            }
        });
    </script>
</body>
</html>
