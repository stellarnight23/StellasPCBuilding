<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Ash's PC Building</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth-nav.js" defer></script>
</head>
<body class="auth-page">
    <header>
        <div class="flex-container"><img src="images/Banner.png" alt="Ash's PC Building Banner" id="banner"></div>
        <nav><ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="policy.html">Terms of Service</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="auth.html">Account</a></li>
        </ul></nav>
        <div class="flex-container"><img src="images/Logo.png" alt="Ash's PC Building Logo" id="logo"></div>
    </header>
    <main class="auth-main">
        <section class="auth-intro">
            <p class="chat-eyebrow">Ash's PC Building</p>
            <h1>Forgot your password?</h1>
            <p>Enter your account email and we will send you a secure reset link.</p>
        </section>
        <section class="auth-card"><div class="auth-form-wrap"><div class="auth-form-panel active">
            <h2>Reset your password</h2>
            <p class="auth-supporting-text">The link will expire after 30 minutes.</p>
            <form id="forgotForm" novalidate>
                <label for="forgotEmail">Email address</label>
                <input id="forgotEmail" type="email" autocomplete="email" required>
                <button class="auth-submit" type="submit">Send reset email</button>
                <p class="form-message" id="forgotMessage" role="status"></p>
            </form>
        </div></div></section>
    </main>
    <footer><p>&copy; 2026 Ash's PC Building</p></footer>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.getElementById('forgotMessage');
            const email = document.getElementById('forgotEmail');
            if (!email.checkValidity()) {
                message.textContent = 'Enter a valid email address.';
                message.classList.add('error');
                return;
            }
            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email.value })
                });
                const result = await response.json();
                message.textContent = result.message || result.error;
                message.classList.toggle('error', !response.ok);
            } catch {
                message.textContent = 'The account server is unavailable. Please try again.';
                message.classList.add('error');
            }
        });
    </script>
</body>
</html>
